name: Extract satusehat-integration-sdk zip

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install unzip (if needed)
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip archive
        run: |
          if [ -f "satusehat-integration-sdk-v0.1.0.zip" ]; then
            unzip -o satusehat-integration-sdk-v0.1.0.zip -d .
          else
            echo "satusehat-integration-sdk-v0.1.0.zip not found in repo root"
            exit 1
          fi

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract satusehat-integration-sdk v0.1.0 from zip" || echo "No changes to commit"
          git push
