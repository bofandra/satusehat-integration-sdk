name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"
      publish:
        description: "Publish to external registries"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      confirmation:
        description: "Type official-production-reference-release"
        required: true

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - id: guard
        shell: bash
        run: |
          if [[ "${{ inputs.version }}" != "v0.1.0" ]]; then
            echo "This workflow is pinned to v0.1.0 for the first production reference release." >&2
            exit 1
          fi
          if [[ "${{ inputs.confirmation }}" != "official-production-reference-release" ]]; then
            echo "confirmation text did not match" >&2
            exit 1
          fi
          if [[ "${{ github.ref }}" != "refs/tags/${{ inputs.version }}" ]]; then
            echo "Run this workflow from tag ${{ inputs.version }}." >&2
            exit 1
          fi
          echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"

  package:
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: curl, pdo_sqlite, sqlite3
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build all release packages
        shell: bash
        run: |
          mkdir -p dist
          cd sdks/python
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          cp dist/* ../../dist/
          cd ../node
          npm ci
          npm test
          npm run build
          npm pack --pack-destination ../../dist
          cd ../java
          mvn -B -Prelease -Dgpg.skip=true package
          cp target/integration-sdk-0.1.0*.jar ../../dist/
          cd ../php
          composer validate --strict
          composer install
          composer test
          cd ../go
          go test ./...
          cd ../dotnet
          dotnet restore
          dotnet pack -c Release
          cp bin/Release/*.nupkg ../../dist/
          cd ../..
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: satusehat-integration-sdk-v0.1.0
          path: dist/

  publish-npm:
    runs-on: ubuntu-latest
    needs: [guard, package]
    if: needs.guard.outputs.publish == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: cd sdks/node && npm ci && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [guard, package]
    if: needs.guard.outputs.publish == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd sdks/python && python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-nuget:
    runs-on: ubuntu-latest
    needs: [guard, package]
    if: needs.guard.outputs.publish == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: cd sdks/dotnet && dotnet pack -c Release && dotnet nuget push "bin/Release/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  publish-github-release:
    runs-on: ubuntu-latest
    needs: [guard, package]
    if: needs.guard.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: satusehat-integration-sdk-v0.1.0
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: SATUSEHAT Integration SDK v0.1.0
          body_path: CHANGELOG.md
          files: dist/*

  publish-maven:
    runs-on: ubuntu-latest
    needs: [guard, package]
    if: needs.guard.outputs.publish == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: cd sdks/java && mvn -B -Prelease -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" -DaltDeploymentRepository="$MAVEN_DEPLOY_REPOSITORY" deploy
        env:
          MAVEN_DEPLOY_REPOSITORY: ${{ secrets.MAVEN_DEPLOY_REPOSITORY }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-packagist:
    runs-on: ubuntu-latest
    needs: [guard, package, publish-github-release]
    if: needs.guard.outputs.publish == 'true'
    permissions:
      contents: read
    steps:
      - name: Refresh Packagist package
        shell: bash
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
            https://packagist.org/api/update-package \
            -d '{"repository":"https://github.com/satusehat-platform/integration-sdk"}'
