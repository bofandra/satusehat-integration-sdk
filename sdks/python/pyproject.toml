[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satusehat-integration-sdk"
version = "0.2.0"
description = "SATUSEHAT Integration SDK reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "SATUSEHAT Integration SDK Contributors"}]
keywords = ["satusehat", "fhir", "healthcare", "integration", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/bofandra/satusehat-integration-sdk"
Repository = "https://github.com/bofandra/satusehat-integration-sdk"
Issues = "https://github.com/bofandra/satusehat-integration-sdk/issues"
Changelog = "https://github.com/bofandra/satusehat-integration-sdk/blob/main/CHANGELOG.md"
Security = "https://github.com/bofandra/satusehat-integration-sdk/security"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
